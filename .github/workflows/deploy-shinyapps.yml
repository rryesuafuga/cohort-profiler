# Deploys the app to shinyapps.io from GitHub — no local R needed.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   SHINYAPPS_TOKEN   the token from shinyapps.io  (Account -> Tokens -> Show)
#   SHINYAPPS_SECRET  the secret revealed by "Show secret" in the same dialog
#
# Then: Actions tab -> deploy-shinyapps -> Run workflow. Deliberately manual —
# a deploy restarts the live app, so it happens when you choose, not on every
# push. The first deployment also takes a while on the shinyapps.io side
# (their servers install every R package before the app can start).
name: deploy-shinyapps

on:
  workflow_dispatch:

concurrency:
  group: deploy-shinyapps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true

      # rsconnect pins the package versions installed here into the bundle
      # manifest, so the server installs what the deploy machine had — which
      # is why the runner needs the full dependency set from DESCRIPTION.
      # Plain install.packages, deliberately not pak: pak stamps Remote*
      # metadata into each installed DESCRIPTION, and with that present the
      # deploy manifest recorded the literal repository name "RSPM" instead
      # of a URL, which broke the shinyapps build fetching any package not in
      # its cache. This installation path was verified to produce a manifest
      # where every package resolves to a real URL. cpp11 and progress are
      # build-time helpers rsconnect's snapshot validation insists on.
      - name: Install app dependencies
        run: |
          Rscript -e '
            options(Ncpus = 4)
            install.packages(c(
              "dplyr", "flextable", "ggplot2", "gtsummary", "naniar",
              "readr", "rmarkdown", "yaml", "zip", "shiny", "knitr",
              "rsconnect", "cpp11", "progress"))
            need <- c("rsconnect", "shiny", "gtsummary", "flextable",
                      "progress", "cpp11")
            miss <- need[!vapply(need, requireNamespace, logical(1),
                                 quietly = TRUE)]
            if (length(miss)) stop("failed to install: ",
                                   paste(miss, collapse = ", "))
          '

      # rsconnect reads renv.lock from the project directory to pin versions
      # even when the lockfile is excluded from the bundle -- and fails,
      # because the lockfile records build-time packages (cpp11 and friends)
      # that the runner never installs. Removing it here (runner only, the
      # repo keeps it) makes rsconnect pin the versions actually installed
      # above instead.
      - name: Keep rsconnect away from renv.lock
        run: rm -f renv.lock

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: dnfxdz-raymond-wayesu
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e '
            if (!nzchar(Sys.getenv("SHINYAPPS_TOKEN")) ||
                !nzchar(Sys.getenv("SHINYAPPS_SECRET"))) {
              stop(paste("Missing credentials. Add SHINYAPPS_TOKEN and",
                         "SHINYAPPS_SECRET as repository secrets:",
                         "Settings -> Secrets and variables -> Actions."),
                   call. = FALSE)
            }
            rsconnect::setAccountInfo(
              name   = Sys.getenv("SHINYAPPS_ACCOUNT"),
              token  = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET"))
            source("deploy/deploy-shinyapps.R")
          '
